
name: Build MYRAA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MYRAA
        run: unzip -o MYRAA-Android-APK-Build.zip -d myraa

      - name: Verify project
        run: |
          test -f myraa/settings.gradle
          test -f myraa/app/build.gradle

      - name: Build APK
        run: gradle -p myraa assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-APK
          path: myraa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
